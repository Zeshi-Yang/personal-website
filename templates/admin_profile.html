<!DOCTYPE html>
{% extends 'base.html' %}
{% block content %}
<html>
<head>
    <title>{% block title %}Admin Profile{% endblock %}</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/main.css') }}">
</head>
<body>
  <div class="wrapper" style="max-width: 900px; margin: 30px auto;">
    <div class="section">
      <h2 style="margin-top: 0;">Profile Content Manager</h2>
      <p>
        <a href="{{ url_for('admin_projects', section='investment') }}">Manage Investment Projects</a>
        |
        <a href="{{ url_for('admin_projects', section='academic') }}">Manage Academic Projects</a>
        |
        <a href="{{ url_for('admin_logout') }}">Logout</a>
      </p>

      {% if saved %}
      <p style="color: #027a48;">Profile updated successfully.</p>
      {% endif %}

      <form method="POST" style="display: grid; row-gap: 12px;">
        <div>
          <label for="name">Display Name</label><br>
          <input id="name" name="name" value="{{ profile['name'] }}" required style="width: 100%;">
        </div>

        <div>
          <label for="headline">Headline</label><br>
          <input id="headline" name="headline" value="{{ profile['headline'] }}" required style="width: 100%;">
        </div>

        <div>
          <label for="email">Email</label><br>
          <input id="email" name="email" value="{{ profile['email'] }}" required style="width: 100%;">
        </div>

        <div>
          <label for="phone">Phone</label><br>
          <input id="phone" name="phone" value="{{ profile['phone'] }}" required style="width: 100%;">
        </div>

        <div>
          <label for="location">Location</label><br>
          <input id="location" name="location" value="{{ profile['location'] }}" required style="width: 100%;">
        </div>

        <div>
          <label for="introduction">Introduction (HTML allowed)</label><br>
          <textarea id="introduction" name="introduction" rows="20" required style="width: 100%; font-family: monospace;">{{ profile['introduction'] }}</textarea>
        </div>

        <div>
          <input type="submit" value="Save Profile" class="submit-botton">
        </div>
      </form>
    </div>
  </div>
</body>
</html>
{% endblock %}
